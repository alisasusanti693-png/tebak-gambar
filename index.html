<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tebak Kata Visual</title>
<style>
/* CSS */
:root{--bg1:#6a5cff;--bg2:#ff7ab8;--card:rgba(255,255,255,.84);--tx:#26264a;--mut:#6b6b95;--line:rgba(255,255,255,.65);--sh:0 10px 30px rgba(40,20,120,.25)}
[data-theme=dark]{--bg1:#171a3a;--bg2:#3b1d5e;--card:rgba(30,32,70,.78);--tx:#f1f1ff;--mut:#a9a9d6;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--tx);background:linear-gradient(145deg,var(--bg1),var(--bg2)) fixed;transition:background .4s}
#app{height:100dvh;max-width:520px;margin:0 auto;position:relative;z-index:1}
.screen{display:none;height:100%;overflow-y:auto;overflow-x:hidden;padding:calc(58px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));flex-direction:column;gap:12px}
.screen>*{flex-shrink:0}
.screen.active{display:flex;animation:enter .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.97)}}
.card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);padding:16px}
.btn{border:0;border-radius:18px;padding:14px 18px;font-weight:800;font-size:1.05rem;font-family:inherit;color:#fff;cursor:pointer;width:100%;min-height:54px;box-shadow:0 5px 0 rgba(0,0,0,.22),0 10px 20px rgba(0,0,0,.15);transition:transform .12s,box-shadow .12s,filter .2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.g{background:linear-gradient(#3ddc97,#13b87a)}.b{background:linear-gradient(#4cc9f0,#2a8df0)}.o{background:linear-gradient(#ffb340,#ff7a1a)}
.y{background:linear-gradient(#ffd23f,#f5a800);color:#4a3200}.p{background:linear-gradient(#ff7aa8,#f0386b)}
.row{display:flex;gap:10px}.row .btn{flex:1}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.top{display:flex;align-items:center;gap:10px;padding-right:50px}
.top b{flex:1;font-size:1.1rem;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.25)}
.icon{width:46px;height:46px;border-radius:15px;border:0;background:var(--card);color:var(--tx);font-size:1.3rem;font-weight:900;cursor:pointer;box-shadow:var(--sh);transition:transform .12s}
.icon:active{transform:scale(.9)}
.fs{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:40;width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--tx);font-size:1.3rem;cursor:pointer;box-shadow:var(--sh);transition:transform .12s}
.fs:hover{transform:scale(1.08)}
h1{margin:0;text-align:center;color:#fff;font-size:clamp(2rem,10vw,2.9rem);line-height:1.05;font-weight:900;text-shadow:0 4px 0 rgba(0,0,0,.2),0 8px 20px rgba(0,0,0,.25)}
.logo{text-align:center;font-size:4.2rem;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.tag{margin:0;text-align:center;color:#fff;font-weight:700}.sub{margin:0;text-align:center;color:#ffe9a8;font-weight:800;font-size:.95rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}.stats small{color:var(--mut);display:block}.stats b{font-size:1.25rem}
.stats .w{grid-column:1/3}
.bar{height:12px;border-radius:9px;background:rgba(127,127,200,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#3ddc97,#ffd23f);transition:width .5s}
.lvl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;color:var(--tx);font-family:inherit;min-height:72px;transition:transform .15s}
.lvl:hover{transform:translateY(-3px) scale(1.01)}.lvl:active{transform:scale(.97)}
.lvl .n{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:1.5rem;font-weight:900;color:#fff;background:linear-gradient(#4cc9f0,#7a5cff)}
.lvl span:nth-child(2){flex:1}.lvl small{display:block;color:var(--mut)}
.lvl.locked{opacity:.65;filter:grayscale(.7)}.lvl.locked .n{background:#8888aa}
.lvl.fresh{animation:unlock .8s}
@keyframes unlock{30%{transform:scale(1.08) rotate(-2deg)}60%{transform:scale(1.08) rotate(2deg)}}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{background:var(--card);border-radius:14px;padding:8px 12px;font-weight:800;box-shadow:var(--sh);transition:transform .2s}
.chip.warn{background:#ff5d6c;color:#fff;animation:pulse .6s infinite}.chip.bump{transform:scale(1.25)}
.heart{display:inline-block;font-size:1.5rem;transition:.3s}.heart.gone{filter:grayscale(1);opacity:.35}.heart.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.7) rotate(15deg)}}
.qcard{text-align:center;min-height:210px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.qcard.in{animation:cardIn .45s cubic-bezier(.2,.9,.3,1.2)}.qcard.ok{animation:ok .6s}.qcard.shake,input.shake{animation:shake .45s}
@keyframes cardIn{from{opacity:0;transform:translateX(40px) scale(.96)}}
@keyframes ok{40%{transform:scale(1.04);box-shadow:0 0 0 6px #3ddc97}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.imgs{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;min-height:110px}
.img{font-size:clamp(2.6rem,13vw,4rem);line-height:1;display:inline-flex;flex-direction:column;align-items:center;padding:8px 12px;background:rgba(127,127,255,.14);border-radius:18px;animation:float 3s ease-in-out infinite}
.img small{font-size:.8rem;font-weight:800;margin-top:4px;color:#f0386b}
.tok{font-size:clamp(1.6rem,8vw,2.4rem);font-weight:900;color:#f0386b;letter-spacing:2px}
.op{font-size:1.6rem;font-weight:900;color:var(--mut)}
.clue{display:inline-block;align-self:center;background:linear-gradient(#ffd23f,#f5a800);color:#4a3200;border-radius:14px;padding:6px 14px;font-weight:800;font-size:.95rem}
.hintbox{color:var(--mut);font-weight:700;min-height:1.2em;animation:enter .3s}.hintbox b{color:var(--tx);letter-spacing:3px;font-size:1.15rem}
.ask{margin:2px 0 0;text-align:center;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.25)}
input[type=text]{width:100%;font-size:1.2rem;font-family:inherit;font-weight:700;text-align:center;padding:15px;border-radius:18px;border:3px solid transparent;background:var(--card);color:var(--tx);outline:0;box-shadow:var(--sh);transition:border-color .2s}
input[type=text]:focus{border-color:#ffd23f}
.msg{min-height:1.4em;text-align:center;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35)}.msg.good{color:#b9ffd9;animation:pop .5s}.msg.bad{color:#ffd0d6}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:1.1rem}
.sw{min-width:80px;padding:10px 16px;border:0;border-radius:14px;font-weight:900;font-family:inherit;cursor:pointer;background:#9a9ac0;color:#fff;transition:.25s}.sw.on{background:linear-gradient(#3ddc97,#13b87a)}
.seg{display:flex;gap:6px}.seg button{border:0;border-radius:12px;padding:10px 12px;font-family:inherit;font-weight:800;cursor:pointer;background:rgba(127,127,200,.25);color:var(--tx)}.seg button.on{background:#7a5cff;color:#fff}
.ach{display:flex;gap:14px;align-items:center;transition:.3s}.ach .ic{font-size:2.2rem}.ach small{display:block;color:var(--mut)}.ach.off{opacity:.5;filter:grayscale(1)}
.res{text-align:center;display:flex;flex-direction:column;gap:8px}.res .big{font-size:4rem;animation:pop .8s}.res h2{margin:0;font-size:1.8rem}
.stat{font-size:1.15rem;padding:8px;border-radius:14px;background:rgba(127,127,200,.14)}.note{margin:0;font-weight:700;color:var(--mut)}.note.ok{color:#13b87a;animation:pop .7s}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,40,.55);display:none;place-items:center;padding:20px}.modal.show{display:grid;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal .card{width:min(100%,380px);text-align:center;display:flex;flex-direction:column;gap:12px;animation:cardIn .4s}.modal h2,.modal p{margin:0}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top));left:0;right:0;z-index:45;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#toast div{background:#26264a;color:#fff;padding:10px 18px;border-radius:30px;font-weight:800;box-shadow:var(--sh);animation:enter .3s,fade .3s 1.7s reverse forwards}
#toast .ach{background:linear-gradient(#ffd23f,#f5a800);color:#4a3200;display:block}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
#fx i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.8}}
.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.deco span{position:absolute;font-size:2.4rem;opacity:.22;animation:float 5s ease-in-out infinite}
@media(max-height:640px){.logo{font-size:2.6rem}.qcard{min-height:170px}.imgs{min-height:80px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<!-- HTML -->
<div class="deco"><span style="left:6%;top:12%">🧩</span><span style="left:82%;top:20%;animation-delay:1s">⭐</span><span style="left:12%;top:70%;animation-delay:2s">💡</span><span style="left:78%;top:78%;animation-delay:.5s">🎈</span><span style="left:48%;top:92%;animation-delay:1.5s">🔤</span></div>
<button class="fs" id="fsBtn" onclick="toggleFullscreen()" aria-label="Fullscreen" title="Fullscreen">⛶</button>
<div id="toast"></div><div id="fx"></div>
<div class="modal" id="modal"><div class="card"><h2 id="mT"></h2><p id="mP"></p><div class="row" id="mB"></div></div></div>

<div id="app">
  <section class="screen active" id="homeScreen">
    <div class="logo">🧩</div>
    <h1>TEBAK<br>KATA VISUAL</h1>
    <p class="tag">Lihat Gambarnya, Pecahkan Katanya!</p>
    <p class="sub">Uji Logika, Tebak Katanya!</p>
    <div class="card stats">
      <div><small>🏆 Skor Tertinggi</small><b id="hHigh">0</b></div>
      <div><small>📍 Level Terakhir</small><b id="hLast">Level 1</b></div>
      <div class="w"><div class="bar"><i id="hBar"></i></div><small id="hProg"></small></div>
    </div>
    <button class="btn g" onclick="showLevels()">▶ PLAY</button>
    <button class="btn b" onclick="showSettings()">⚙ SETTING</button>
    <button class="btn o" onclick="showAch()">🏆 PRESTASI</button>
  </section>

  <section class="screen" id="levelScreen">
    <div class="top"><button class="icon" onclick="goHome()">←</button><b>PILIH LEVEL</b></div>
    <div id="levelList" style="display:flex;flex-direction:column;gap:12px"></div>
  </section>

  <section class="screen" id="gameScreen">
    <div class="top"><button class="icon" onclick="quitGame()">←</button><b id="gNo">Soal 1 / 10</b></div>
    <div class="hud"><span id="gLives"></span><span class="chip" id="gScoreBox">⭐ SKOR: <span id="gScore">0</span></span><span class="chip" id="gTimer">⏱ 30</span></div>
    <div class="bar"><i id="gBar"></i></div>
    <div class="card qcard" id="qCard"><div class="imgs" id="qImgs"></div><div class="clue" id="qClue"></div><div class="hintbox" id="qHint"></div></div>
    <h3 class="ask">Apa jawabannya?</h3>
    <input type="text" id="ans" maxlength="40" placeholder="Ketik jawaban..." autocomplete="off" autocapitalize="none" spellcheck="false">
    <div class="msg" id="msg"></div>
    <button class="btn g" onclick="submitAnswer()">JAWAB</button>
    <div class="row"><button class="btn y" onclick="useHint()">💡 PETUNJUK</button><button class="btn p" onclick="skipQuestion()">⏭ LEWATI</button></div>
  </section>

  <section class="screen" id="resultScreen">
    <div class="card res" id="rBox"></div>
    <div id="rBtns" style="display:flex;flex-direction:column;gap:12px"></div>
  </section>

  <section class="screen" id="settingScreen">
    <div class="top"><button class="icon" onclick="goHome()">←</button><b>⚙ SETTING</b></div>
    <div class="card" id="setList" style="display:flex;flex-direction:column;gap:16px"></div>
    <button class="btn b" onclick="goHome()">KEMBALI</button>
  </section>

  <section class="screen" id="achievementScreen">
    <div class="top"><button class="icon" onclick="goHome()">←</button><b>🏆 PRESTASI</b></div>
    <div id="achList" style="display:flex;flex-direction:column;gap:12px"></div>
  </section>
</div>

<script>
// DATA GAME
// images: token teks huruf besar (mis. "TE") atau emoji. Format "emoji|label" menampilkan label kecil di bawah gambar.
// answers: jawaban benar (spasi/tanda hubung/huruf besar-kecil diabaikan, jadi "mata hari" = "matahari").
const mk = def => (images, answers, hint, clue) => ({ images, clue: clue || def, answers: [].concat(answers), hint });
const q1 = mk("Gabungkan nama kedua gambar sesuai urutan.");
const q2 = mk("Tambahkan huruf/suku kata pada nama gambar sesuai urutan.");
const q3 = mk("Hapus huruf yang ditandai dari nama gambar.");
const q4 = mk("Ganti huruf yang ditandai pada nama gambar (A→B).");
const q5 = mk("Gabungkan semua langkah sesuai urutan.");
const levels = [
  { level: 1, name: "Sangat Mudah", time: 40, questions: [
    q1(["👁️","📅"], "mata hari", "Bersinar terang di siang hari."),
    q1(["🐴","🌊"], "kuda laut", "Hewan kecil di laut yang kepalanya mirip kuda."),
    q1(["🔑","🚪"], "kunci pintu", "Dipakai agar rumah terkunci."),
    q1(["🚢","🌊"], "kapal laut", "Kendaraan besar pengangkut penumpang di samudra."),
    q1(["🧥","🌧️"], "jas hujan", "Dipakai agar badan tidak basah kuyup."),
    q1(["🪑","🛞"], "kursi roda", "Alat bantu bagi orang yang sulit berjalan."),
    q1(["👟","⚽"], "sepatu bola", "Dipakai pemain di lapangan hijau."),
    q1(["🌳","🍎"], "pohon apel", "Tempat buah merah tumbuh."),
    q1(["🪥","🦷"], "sikat gigi", "Dipakai sebelum tidur."),
    q1(["🥚","🐔"], "telur ayam", "Bahan sarapan dari kandang.")
  ]},
  { level: 2, name: "Mudah", time: 40, questions: [
    q2(["TE","🪜"], "tetangga", "Orang yang tinggal di dekat rumahmu.", "Tambahkan TE di depan nama gambar."),
    q2(["🦁","PURA"], "singapura", "Negara kota di ujung Semenanjung Malaya.", "Tambahkan PURA di belakang nama gambar."),
    q2(["👑","WALI"], "rajawali", "Burung pemangsa gagah dengan cakar tajam."),
    q2(["🍯","RA"], "madura", "Pulau di timur laut Jawa, terkenal garamnya."),
    q2(["🐘","MADA"], "gajah mada", "Mahapatih Majapahit dengan Sumpah Palapa."),
    q2(["🧊","KRIM"], "es krim", "Dingin, manis, dijual di gerobak."),
    q2(["🌼","TIDUR"], "bunga tidur", "Apa yang kamu lihat saat terlelap."),
    q2(["📅","RAYA"], "hari raya", "Saat berkumpul dengan keluarga besar."),
    q2(["🌙","SABIT"], "bulan sabit", "Wujud bulan di awal bulan Hijriah."),
    q2(["🍌","GORENG"], "pisang goreng", "Camilan sore berwarna keemasan.")
  ]},
  { level: 3, name: "Sedang", time: 40, questions: [
    q3(["🐄|−S"], "api", "Panas dan menyala; jangan main-main dengannya."),
    q3(["🌶️|−C"], "abai", "Tidak mempedulikan sesuatu."),
    q3(["🐚|−K"], "erang", "Suara orang yang menahan sakit."),
    q3(["🪵|−K"], "ayu", "Sebutan untuk gadis yang cantik jelita."),
    q3(["🍎|−A"], "pel", "Alat untuk membersihkan lantai."),
    q3(["🎸|−R"], "gita", "Dalam bahasa lama, artinya nyanyian."),
    q3(["🌊|−O"], "mbak", "Panggilan akrab untuk kakak perempuan."),
    q3(["🍽️|−P"], "iring", "Berjalan menemani di samping atau belakang."),
    q3(["🌽|−J"], "agung", "Besar dan mulia."),
    q3(["🔨|−P"], "alu", "Pasangan lesung untuk menumbuk padi.")
  ]},
  { level: 4, name: "Sulit", time: 45, questions: [
    q4(["🍚|N→B"], "basi", "Kondisi makanan yang sudah lama dan berbau."),
    q4(["🐟|I→A"], "akan", "Kata penanda sesuatu yang terjadi nanti."),
    q4(["🧵|B→T"], "tenang", "Damai dan tidak gelisah."),
    q4(["🦅|E→U"], "ulang", "Melakukan sekali lagi."),
    q4(["🏠|U→A"], "ramah", "Sikap sopan dan menyenangkan."),
    q4(["🚪|U→A"], "pinta", "Permohonan atau permintaan."),
    q4(["🧂|G→K"], "karam", "Kapal yang tenggelam di laut."),
    q4(["🚢|L→K"], "kapak", "Alat penebang pohon."),
    q4(["📖|B→S"], "suku", "Kelompok etnis, seperti Sunda atau Batak."),
    q4(["🏐|O→I"], "bila", "Kata tanya untuk waktu, mirip 'kapan'.")
  ]},
  { level: 5, name: "Sangat Sulit", time: 60, questions: [
    q5(["TE","🪜","🏠"], "tetangga rumah", "Orang di sebelah, ditambah tempat bernaung.", "TE + gambar 1, lalu gambar 2."),
    q5(["🍚","🍚|N→B"], "nasi basi", "Makanan yang tidak layak dimakan.", "Gambar 1, lalu gambar 2 dengan huruf diganti."),
    q5(["🍽️","BER","🟰"], "makan bersama", "Acara kumpul di meja makan.", "Gambar 1 + BER + arti gambar 3 (sama)."),
    q5(["💧","🧵|B→T"], "air tenang", "Dalam pepatah, bisa menghanyutkan.", "Gambar 1, lalu gambar 2 dengan huruf diganti."),
    q5(["📖|B→S","🌸"], "suku bunga", "Persentase yang dibayar bank pada tabungan.", "Ganti huruf gambar 1, lalu gabung gambar 2."),
    q5(["🦅|E→U","🗓️|365 hari"], "ulang tahun", "Hari saat kamu meniup lilin.", "Ganti huruf gambar 1 + kata untuk '365 hari'."),
    q5(["🚢|L→K","🔴"], "kapak merah", "Alat penebang yang berwarna menyala.", "Ganti huruf gambar 1, lalu warna gambar 2."),
    q5(["🍽️|−P","🍽️|−P","AN"], "iring iringan", "Barisan kendaraan yang berjalan bersamaan.", "Hapus P pada kedua gambar, lalu tambah AN."),
    q5(["🦋","🦋","🌙"], "kupu kupu malam", "Serangga bersayap indah yang terbang saat gelap.", "Gambar 1 dua kali, lalu gambar 3."),
    q5(["👁️","💧","🔥|panas"], "mata air panas", "Sumber air hangat di kaki gunung.", "Gabungkan ketiganya (gambar 3 = suhu tinggi).")
  ]}
];
const ACH = [
  { id: "pemula", ic: "🏆", n: "Pemula", d: "Menyelesaikan level pertama" },
  { id: "jago", ic: "🔥", n: "Jago Tebak", d: "Menjawab 20 soal dengan benar" },
  { id: "sempurna", ic: "💯", n: "Sempurna", d: "Mendapat skor 900+ dalam satu level" },
  { id: "fokus", ic: "🎯", n: "Fokus", d: "Menjawab 5 soal berturut-turut dengan benar" },
  { id: "juara", ic: "👑", n: "Juara", d: "Menyelesaikan semua level" }
];

// LOCAL STORAGE
const KEY = "tebak_kata_visual_v1";
const defaults = { unlocked: 1, high: 0, last: 1, totalCorrect: 0, maxStreak: 0, best: {}, done: [], ach: {}, settings: { sound: true, music: false, fx: true, theme: "light" } };
function loadData() {
  try {
    const o = JSON.parse(localStorage.getItem(KEY));
    if (o) return { ...defaults, ...o, settings: { ...defaults.settings, ...(o.settings || {}) } };
  } catch (e) {}
  return JSON.parse(JSON.stringify(defaults));
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} }
const D = loadData();
const $ = id => document.getElementById(id);

// SOUND
let ac = null, mt = null, mi = 0;
function tone(f, d = .12, type = "sine", t0 = 0, v = .15, force = false) {
  if (!force && !D.settings.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + t0;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(.001, s + d);
    o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s + d);
  } catch (e) {}
}
const sfx = {
  click: () => tone(520, .07, "square", 0, .05),
  good: () => { tone(660, .1); tone(880, .18, "sine", .1); },
  bad: () => tone(160, .28, "sawtooth", 0, .09),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, "triangle", i * .12)),
  unlock: () => [784, 988, 1319].forEach((f, i) => tone(f, .16, "sine", i * .1))
};
const melody = [262, 330, 392, 330, 294, 349, 440, 349];
function musicUpdate() {
  clearInterval(mt); mt = null;
  if (D.settings.music) mt = setInterval(() => tone(melody[mi++ % 8], .35, "sine", 0, .05, true), 420);
}
function vibrate(ms) { try { if (D.settings.fx && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// NAVIGATION
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  sfx.click();
}
function goHome() { clearInterval(S.timer); closeModal(); renderHome(); show("homeScreen"); }
function renderHome() {
  $("hHigh").textContent = D.high;
  $("hLast").textContent = "Level " + D.last;
  $("hBar").style.width = (D.done.length / levels.length * 100) + "%";
  $("hProg").textContent = D.done.length + " / " + levels.length + " level selesai";
}
function showLevels(freshLevel) {
  $("levelList").innerHTML = levels.map(l => {
    const open = l.level <= D.unlocked, best = D.best[l.level];
    return `<button class="card lvl ${open ? "" : "locked"} ${l.level === freshLevel ? "fresh" : ""}" onclick="${open ? `startLevel(${l.level})` : "lockedMsg()"}">
      <span class="n">${l.level}</span>
      <span><b>LEVEL ${l.level} ${open ? "" : "🔒"}</b><small>${l.name} · ${l.questions.length} soal${best ? " · ⭐ " + best : ""}</small></span>
      <span>${D.done.includes(l.level) ? "✅" : ""}</span></button>`;
  }).join("");
  show("levelScreen");
}
function lockedMsg() { sfx.bad(); toast("🔒 Selesaikan level sebelumnya dulu (min. 5 benar)"); }
function toast(msg, cls = "") {
  const d = document.createElement("div");
  d.textContent = msg; if (cls) d.className = cls;
  $("toast").appendChild(d); setTimeout(() => d.remove(), 2100);
}
function showModal(title, text, buttons) {
  $("mT").textContent = title; $("mP").textContent = text; $("mB").innerHTML = "";
  buttons.forEach(b => {
    const el = document.createElement("button");
    el.className = "btn " + b.cls; el.textContent = b.t;
    el.onclick = () => { closeModal(); b.fn(); };
    $("mB").appendChild(el);
  });
  $("modal").classList.add("show");
}
function closeModal() { $("modal").classList.remove("show"); }

// GAME STATE
let S = {};
const curQ = () => S.L.questions[S.idx];
function startLevel(n) {
  if (n > D.unlocked) return;
  clearInterval(S.timer);
  const L = levels[n - 1];
  S = { lv: n, L, idx: 0, score: 0, lives: 3, correct: 0, wrong: 0, streak: 0, qWrong: 0, hintLv: 0, time: L.time, locked: false, over: false, justLost: false };
  D.last = n; save();
  show("gameScreen"); loadQuestion();
}
function loadQuestion() {
  const q = curQ();
  S.qWrong = 0; S.hintLv = 0; S.locked = false; S.time = S.L.time;
  $("qImgs").innerHTML = q.images.map((t, i) => {
    const [a, b] = t.split("|");
    return (i ? '<span class="op">+</span>' : "") + `<span class="img${/^[A-Z]{2,}$/.test(a) ? " tok" : ""}">${a}${b ? `<small>${b}</small>` : ""}</span>`;
  }).join("");
  $("qClue").textContent = q.clue;
  $("qHint").innerHTML = ""; $("ans").value = ""; $("msg").textContent = ""; $("msg").className = "msg";
  const c = $("qCard"); c.className = "card qcard"; void c.offsetWidth; c.classList.add("in");
  renderHud(); startTimer();
  if (!matchMedia("(pointer:coarse)").matches) setTimeout(() => $("ans").focus({ preventScroll: true }), 350);
}
function renderHud() {
  $("gNo").textContent = `Soal ${S.idx + 1} / ${S.L.questions.length}`;
  $("gScore").textContent = S.score;
  $("gBar").style.width = (S.idx / S.L.questions.length * 100) + "%";
  let h = "";
  for (let i = 0; i < 3; i++) h += `<span class="heart ${i < S.lives ? "" : "gone"} ${i === S.lives && S.justLost ? "pop" : ""}">${i < S.lives ? "❤️" : "🖤"}</span> `;
  $("gLives").innerHTML = h;
}

// TIMER
function startTimer() {
  clearInterval(S.timer); renderTimer();
  S.timer = setInterval(() => {
    S.time--; renderTimer();
    if (S.time <= 0) { clearInterval(S.timer); timeUp(); }
  }, 1000);
}
function renderTimer() {
  const t = $("gTimer");
  t.textContent = "⏱ " + Math.max(S.time, 0);
  t.classList.toggle("warn", S.time <= 10);
}
function timeUp() {
  if (S.locked || S.over) return;
  S.locked = true; S.streak = 0; sfx.bad(); vibrate(200);
  showModal("⏰ Waktu Habis!", "Mau coba lagi soal ini atau lewati?", [
    { t: "COBA LAGI", cls: "g", fn: () => { S.time = S.L.time; S.locked = false; startTimer(); } },
    { t: "LEWATI", cls: "p", fn: () => { S.wrong++; nextQuestion(); } }
  ]);
}
function quitGame() {
  if (S.over) return goHome();
  clearInterval(S.timer);
  showModal("Keluar dari level?", "Progres level ini tidak akan disimpan.", [
    { t: "LANJUT MAIN", cls: "g", fn: () => { if (!S.locked) startTimer(); } },
    { t: "KELUAR", cls: "p", fn: goHome }
  ]);
}

// ANSWER SYSTEM
function norm(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
function say(text, cls) { const m = $("msg"); m.textContent = text; m.className = "msg " + cls; }
function shake(el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function submitAnswer() {
  if (S.locked || S.over) return;
  const v = norm($("ans").value);
  if (!v) { say("Silakan masukkan jawaban terlebih dahulu.", "bad"); shake($("ans")); return; }
  if (curQ().answers.some(a => norm(a) === v)) onCorrect(); else onWrong();
}
function onCorrect() {
  S.locked = true; clearInterval(S.timer);
  const pts = S.hintLv ? 50 : 100;
  S.score += pts; S.correct++; S.streak++; D.totalCorrect++;
  if (S.streak > D.maxStreak) D.maxStreak = S.streak;
  say("Benar! 🎉 +" + pts, "good"); sfx.good(); confetti(22); vibrate(60);
  $("qCard").className = "card qcard ok";
  const sb = $("gScoreBox"); sb.classList.add("bump"); setTimeout(() => sb.classList.remove("bump"), 300);
  checkAch(); renderHud();
  setTimeout(nextQuestion, 1200);
}
function onWrong() {
  S.wrong++; S.qWrong++; S.streak = 0;
  say("Jawaban salah, coba lagi!", "bad"); sfx.bad(); vibrate(120);
  shake($("qCard")); shake($("ans")); $("ans").select();
  if (S.qWrong % 2 === 0) loseLife();
}
function loseLife() {
  S.lives--; S.justLost = true; renderHud();
  setTimeout(() => { S.justLost = false; }, 600);
  if (S.lives <= 0) { S.locked = true; clearInterval(S.timer); setTimeout(() => finish(true), 800); }
}
function useHint() {
  if (S.locked || S.over) return;
  sfx.click();
  const q = curQ(), a = q.answers[0];
  S.hintLv = Math.min(S.hintLv + 1, 2);
  const pattern = a.split(" ").map(w => w.split("").map((c, i) => (S.hintLv >= 2 && i === 0) ? c.toUpperCase() : "_").join(" ")).join("&nbsp;&nbsp;&nbsp;");
  $("qHint").innerHTML = `<b>${pattern}</b><br>💡 ${q.hint}<br><small>${S.hintLv < 2 ? "Tekan lagi untuk huruf awal · " : ""}skor soal ini jadi +50</small>`;
}
function skipQuestion() {
  if (S.locked || S.over) return;
  S.locked = true; clearInterval(S.timer); S.wrong++; S.streak = 0;
  say("Soal dilewati ⏭", "bad"); sfx.click();
  setTimeout(nextQuestion, 500);
}
function nextQuestion() {
  if (S.over) return;
  S.idx++;
  if (S.idx >= S.L.questions.length) finish(false); else loadQuestion();
}

// SCORE
function finish(isGameOver) {
  clearInterval(S.timer); S.over = true;
  const total = S.correct + S.wrong, acc = total ? Math.round(S.correct / total * 100) : 0, L = S.lv;
  let passed = false, unlocked = false;
  if (S.score > D.high) D.high = S.score;
  if (!isGameOver) {
    D.best[L] = Math.max(D.best[L] || 0, S.score);
    passed = S.correct >= 5;
    if (passed && !D.done.includes(L)) D.done.push(L);
    if (passed && L < levels.length && D.unlocked < L + 1) { D.unlocked = L + 1; unlocked = true; }
  }
  save(); checkAch();
  const note = unlocked ? `<p class="note ok">🔓 Level ${L + 1} terbuka!</p>` : (!isGameOver && !passed ? `<p class="note">Butuh minimal 5 jawaban benar untuk membuka level berikutnya.</p>` : "");
  $("rBox").innerHTML = `<div class="big">${isGameOver ? "💀" : passed ? "🎉" : "😅"}</div>
    <h2>${isGameOver ? "GAME OVER" : "LEVEL SELESAI!"}</h2>
    <div class="stat">⭐ Skor: <b>${S.score}</b></div>
    <div class="stat">✅ Benar: <b>${S.correct}</b></div>
    <div class="stat">❌ Salah: <b>${S.wrong}</b></div>
    <div class="stat">${isGameOver ? "📍 Level: <b>" + L + "</b>" : "🎯 Akurasi: <b>" + acc + "%</b>"}</div>${note}`;
  $("rBtns").innerHTML = isGameOver
    ? `<button class="btn g" onclick="startLevel(${L})">COBA LAGI</button><button class="btn b" onclick="goHome()">KEMBALI KE MENU</button>`
    : `${passed && L < levels.length ? `<button class="btn g ${unlocked ? "pulse" : ""}" onclick="startLevel(${L + 1})">LANJUT LEVEL</button>` : ""}<button class="btn o" onclick="startLevel(${L})">MAIN LAGI</button><button class="btn b" onclick="goHome()">MENU UTAMA</button>`;
  show("resultScreen");
  if (isGameOver) sfx.bad(); else if (passed) { sfx.win(); confetti(70); if (unlocked) setTimeout(sfx.unlock, 700); }
}

// ACHIEVEMENTS
function checkAch() {
  const c = {
    pemula: D.done.includes(1),
    jago: D.totalCorrect >= 20,
    sempurna: Object.values(D.best).some(v => v >= 900),
    fokus: D.maxStreak >= 5,
    juara: levels.every(l => D.done.includes(l.level))
  };
  ACH.forEach(a => {
    if (c[a.id] && !D.ach[a.id]) { D.ach[a.id] = 1; toast("🏆 Prestasi: " + a.n, "ach"); setTimeout(sfx.unlock, 300); }
  });
  save();
}
function showAch() {
  $("achList").innerHTML = ACH.map(a => `<div class="card ach ${D.ach[a.id] ? "" : "off"}"><span class="ic">${a.ic}</span><div><b>${a.n}</b><small>${a.d}</small></div><span style="margin-left:auto">${D.ach[a.id] ? "✅" : "🔒"}</span></div>`).join("");
  show("achievementScreen");
}

// SETTINGS
function showSettings() { renderSettings(); show("settingScreen"); }
function renderSettings() {
  const t = D.settings.theme;
  $("setList").innerHTML = [["sound", "🔊 Suara"], ["music", "🎵 Musik"], ["fx", "📳 Efek"]].map(([k, l]) =>
    `<div class="set"><span>${l}</span><button class="sw ${D.settings[k] ? "on" : ""}" onclick="toggleSet('${k}')">${D.settings[k] ? "ON" : "OFF"}</button></div>`).join("") +
    `<div class="set"><span>🌙 Tema</span><div class="seg"><button class="${t === "light" ? "on" : ""}" onclick="setTheme('light')">☀️ Light</button><button class="${t === "dark" ? "on" : ""}" onclick="setTheme('dark')">🌙 Dark</button></div></div>`;
}
function toggleSet(k) { D.settings[k] = !D.settings[k]; save(); if (k === "music") musicUpdate(); renderSettings(); sfx.click(); }
function setTheme(t) { D.settings.theme = t; save(); applyTheme(); renderSettings(); sfx.click(); }
function applyTheme() { document.documentElement.dataset.theme = D.settings.theme; }

// EFFECTS
function confetti(n = 40) {
  if (!D.settings.fx) return;
  const box = $("fx"), cols = ["#ff5d8f", "#ffd23f", "#3ddc97", "#4cc9f0", "#b388ff"];
  for (let i = 0; i < n; i++) {
    const p = document.createElement("i");
    p.style.cssText = `left:${Math.random() * 100}%;background:${cols[i % 5]};animation-delay:${Math.random() * .3}s;--x:${Math.random() * 160 - 80}px;--r:${Math.random() * 720}deg`;
    box.appendChild(p); setTimeout(() => p.remove(), 2300);
  }
}

// FULLSCREEN
function toggleFullscreen() {
  try {
    const d = document, e = d.documentElement, on = d.fullscreenElement || d.webkitFullscreenElement;
    const fn = on ? (d.exitFullscreen || d.webkitExitFullscreen) : (e.requestFullscreen || e.webkitRequestFullscreen);
    if (!fn) return toast("Fullscreen tidak didukung browser ini");
    const r = fn.call(on ? d : e);
    if (r && r.catch) r.catch(() => toast("Fullscreen gagal dibuka"));
  } catch (err) { toast("Fullscreen gagal dibuka"); }
}
["fullscreenchange", "webkitfullscreenchange"].forEach(ev => document.addEventListener(ev, () => {
  $("fsBtn").textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? "✕" : "⛶";
}));

// INIT
$("ans").addEventListener("keydown", e => { if (e.key === "Enter") submitAnswer(); });
document.addEventListener("pointerdown", () => { if (D.settings.music && !mt) musicUpdate(); }, { once: true });
applyTheme(); renderHome(); checkAch();
</script>
</body>
</html>
